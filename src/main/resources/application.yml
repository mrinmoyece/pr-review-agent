spring:
  application:
    name: pr-review-agent
  threads:
    virtual:
      enabled: true    # Java 21 virtual threads — improves throughput under load
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s

server:
  port: 8080

# ── LLM Provider ────────────────────────────────────────────────────────────
llm:
  provider: ${LLM_PROVIDER:github_models}
  chat-deployment: ${AZURE_CHAT_DEPLOYMENT:gpt-4o}

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    key: ${AZURE_OPENAI_API_KEY:}

github:
  token: ${GITHUB_TOKEN:}
  auth:
    mode: ${GITHUB_AUTH_MODE:token}
  app:
    id: ${GITHUB_APP_ID:}
    installation-id: ${GITHUB_APP_INSTALLATION_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
  repository-allowlist: ${GITHUB_REPOSITORY_ALLOWLIST:}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
  models:
    endpoint: ${GITHUB_MODELS_ENDPOINT:https://models.inference.ai.azure.com}
    token: ${GITHUB_MODELS_TOKEN:}

# ── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:
  retry:
    instances:
      github-read:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.RestClientResponseException
          - org.springframework.web.client.ResourceAccessException
      llm:
        max-attempts: 3
        wait-duration: 5s
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      github:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      llm:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
      jira:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s

# ── Jira integration (optional — leave blank to disable) ─────────────────────
jira:
  base-url: ${JIRA_BASE_URL:}
  token: ${JIRA_TOKEN:}
  user-email: ${JIRA_USER_EMAIL:}

# ── Review history ────────────────────────────────────────────────────────────
review:
  auto-fix:
    enabled: ${REVIEW_AUTO_FIX_ENABLED:false}
  webhook:
    max-payload-bytes: ${REVIEW_MAX_WEBHOOK_BYTES:10485760}
    delivery-retention: ${REVIEW_WEBHOOK_DELIVERY_RETENTION:24h}
  manual-trigger:
    enabled: ${REVIEW_MANUAL_TRIGGER_ENABLED:false}
    token: ${REVIEW_MANUAL_TRIGGER_TOKEN:}
  llm:
    chunk-characters: ${REVIEW_LLM_CHUNK_CHARACTERS:24000}
    max-diff-characters: ${REVIEW_LLM_MAX_DIFF_CHARACTERS:120000}
    max-findings-per-pass: ${REVIEW_LLM_MAX_FINDINGS_PER_PASS:25}
    max-chunks-per-pass: ${REVIEW_LLM_MAX_CHUNKS_PER_PASS:20}
    verification-candidates-per-request: ${REVIEW_LLM_VERIFICATION_BATCH_SIZE:20}
  history:
    pr-count: ${REVIEW_HISTORY_PR_COUNT:20}

# ── Async thread pool ──────────────────────────────────────────────────────
# ── Actuator ──────────────────────────────────────────────────────────────
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,redis
  metrics:
    tags:
      application: ${spring.application.name}
