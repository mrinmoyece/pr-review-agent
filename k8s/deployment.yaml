apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-review-agent
  labels:
    app: pr-review-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pr-review-agent
  template:
    metadata:
      labels:
        app: pr-review-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: pr-review-agent
          image: your-registry/pr-review-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pr-review-agent-secrets
                  key: github-token
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: pr-review-agent
spec:
  selector:
    app: pr-review-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
